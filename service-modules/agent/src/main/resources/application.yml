server:
  port: 8100
  servlet:
    context-path: /agent
spring:
  application:
    name: agent
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      discovery:
        namespace: public
        import-check:
          enabled: false
      config:
        namespace: public
  config:
    import:
      - optional:nacos:agent.yml?group=DEFAULT_GROUP&refreshEnabled=true
  data:
    redis:
      host: localhost
      port: 6379
      password:
  datasource:
    dynamic:
      primary: master
      datasource:
        # 主库数据源
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/zhiran_agentos?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: root
          password: root

rag:
  store:
    type: elasticsearch  # milvus | elasticsearch | pgvector | qdrant
    collection-prefix: zhiran_rag
    elasticsearch:
      url: http://127.0.0.1:9200
      username:
      password:
      disable-ssl-verification: false
    milvus:
      host: http://localhost:19530
      database: default
      username: root
      password:
      token:
      connect-timeout: 10s
    pgvector:
      jdbc-url:
      username:
      password:
      schema: public
      connection-timeout: 30s
    qdrant:
      location:
      api-key:
      check-compatibility: true

agent:
  skill:
    nacos:
      namespace-id:

knowledge:
  source:
    # 多实例部署时必须配置为所有实例可读写的共享挂载目录。
    root: ./knowledge-uploads
    max-file-size: 50MB
  processing:
    enabled: true
    lease-duration: 30m
    concurrency: 2
    queue-capacity: 20
    recovery-batch-size: 4
    embedding-batch-size: 20

mybatis-plus:
  type-handlers-package: com.zhiran.agent.factory.stateStoreFactory
  # 全局配置
  global-config:
    db-config:
      # 全局设置主键生成策略
      id-type: ASSIGN_ID
      logic-delete-field: deleted   # 全局逻辑删除字段名，与实体类字段对应
      logic-delete-value: 1         # 逻辑已删除值（默认1）
      logic-not-delete-value: 0     # 逻辑未删除值（默认0）
  # 搜索指定包别名
  type-aliases-package: com.zhiran.agent.mapper
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath:mapper/*.xml
  # MyBatis配置
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 使用字符串方式处理枚举
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
