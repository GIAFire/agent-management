server:
  port: 8100
  servlet:
    context-path: /agent
spring:
  application:
    name: agent
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      discovery:
        namespace: 418ac824-016b-4eff-bbde-82b7ce26305d
        import-check:
          enabled: false
      config:
        namespace: 418ac824-016b-4eff-bbde-82b7ce26305d
  config:
    import:
      - optional:nacos:agent.yml?group=DEFAULT_GROUP&refreshEnabled=true
  data:
    redis:
      host: localhost
      port: 6379
      password:
  datasource:
    dynamic:
      primary: master
      datasource:
        # 主库数据源
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${FE_IP}:3306/test_qms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: root
          password: ${FE185PWD}
          # 从库数据源
          # slave:
          #   driver-class-name: com.mysql.cj.jdbc.Driver
          #   url: jdbc:mysql://localhost:3306/my_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          #   username: root
          #   password: root

rag:
  store:  # pgvector | milvus | qdrant | elasticsearch ，向量存储类型
    milvus:
      host: http://localhost:19530
      username: root  # Milvus 用户名，自建部署留空
      password:    # Milvus 密码，自建部署留空
      token:          # Milvus SaaS 认证 token，与用户名/密码二选一
      database: default  # 默认库名
#    elasticsearch:
#      uris: http://127.0.0.1:9200
#      username:
#      password:
#      api-key:
#      index-prefix: apboa_rag
#      connect-timeout: 5000
#      socket-timeout: 60000

agent:
  skill:
    nacos:
      namespace-id: 418ac824-016b-4eff-bbde-82b7ce26305d

knowledge:
  source:
    # 多实例部署时必须配置为所有实例可读写的共享挂载目录。
    root: ./knowledge-uploads
    max-file-size: 50MB
  tasks:
    poll-interval: 2s
    lease-duration: 30m
    concurrency: 2
    claim-batch-size: 4
    embedding-batch-size: 20

mybatis-plus:
  type-handlers-package: com.zw.agent.factory.stateStoreFactory
  # 全局配置
  global-config:
    db-config:
      # 全局设置主键生成策略
      id-type: ASSIGN_ID
      logic-delete-field: deleted   # 全局逻辑删除字段名，与实体类字段对应
      logic-delete-value: 1         # 逻辑已删除值（默认1）
      logic-not-delete-value: 0     # 逻辑未删除值（默认0）
  # 搜索指定包别名
  type-aliases-package: com.zw.agent.mapper
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath:mapper/*.xml
  # MyBatis配置
  configuration:
    # 使用字符串方式处理枚举
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
